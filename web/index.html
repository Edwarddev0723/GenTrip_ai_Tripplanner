<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>GenTrip 主頁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <img src="../images/GENTRIPLOGO_svg.svg" alt="GenTrip logo" class="logo">
    <ul class="nav-links">
      <li><a href="#">首頁</a></li>
      <li><a href="#">AI旅遊規劃</a></li>
      <li><a href="#">旅平險計算</a></li>
      <li><a href="#">AI旅遊記帳</a></li>
      <li><a href="#">我的行程</a></li>
    </ul>
  </nav>

  <img src="../images/main_pageBG.png" alt="main banner" class="banner">

  <div class="chat">
    <div class="message user">我想要前往台中一日遊，但我真的沒有時間也不擅長，你可以幫我規劃嗎?😟😟</div>
    <div class="message assistant">好的!這是我的專業!立刻為您規劃😎😎</div>
    <input type="text" placeholder="輸入下個旅遊地點吧🏂">
  </div>

  <h2 class="section-title">更多功能</h2>
  <div class="button-container">
    <a href="#" class="button">
      <img src="https://img.icons8.com/material-outlined/50/FD7E14/bot.png" alt="AI行程規劃">
      <span>AI行程規劃</span>
    </a>
    <a href="#" class="button">
      <img src="https://img.icons8.com/material-sharp/50/40C057/accounting.png" alt="旅行記帳">
      <span>旅行記帳</span>
    </a>
    <a href="#" class="button">
      <img src="https://img.icons8.com/material/50/22C3E6/security-checked--v1.png" alt="旅平險計算">
      <span>旅平險計算</span>
    </a>
  </div>

  <h2 class="section-title">GenTrip AI 行程規劃小助手 Beta計畫介紹</h2>
  <div class="intro">
    想出外遊玩，但沒時間規劃行程嗎？<br>
    想走就走隨性出遊，懶得找景點美食資訊嗎？<br>
    玩到不知道去哪玩，想找尋旅遊靈感嗎？<br>
    快來嘗試「AI行程規劃小助手」的服務吧！
  </div>

  <h2 class="section-title">推薦旅遊回憶</h2>
  <div class="slideshow-container">
    <div class="mySlides fade">
      <img src="../images/Group 8.png" style="width:100%">
    </div>
    <div class="mySlides fade">
      <img src="../images/Group 9.png" style="width:100%">
    </div>
    <div class="mySlides fade">
      <img src="../images/Group 10.png" style="width:100%">
    </div>
  </div>
  <div style="text-align:center">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <script src="main.js"></script>
</body>
</html>
